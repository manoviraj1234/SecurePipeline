name: SecurePipeline CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-pipeline:
    name: Security Testing & Gate
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # STAGE 1: SOURCE CHECKOUT & ENVIRONMENT SETUP
      # =========================================================================

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          mkdir -p reports/raw reports

      # =========================================================================
      # STAGE 2: SECURITY TOOL INSTALLATION & VERIFICATION
      # =========================================================================

      # Fix compatibility with older Semgrep dependencies
      - name: Install Setuptools Compatibility
        run: |
          python -m pip install "setuptools<81"
          python -c "import pkg_resources; print('pkg_resources available')"

      - name: Install Semgrep SAST
        run: |
          python -m pip install semgrep==1.95.0

          # Restore pkg_resources compatibility
          python -m pip install --force-reinstall "setuptools==80.9.0"

          # Verify Semgrep and pkg_resources
          python -c "import pkg_resources; print('pkg_resources available')"
          semgrep --version

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"

          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

          sudo chmod +x /usr/local/bin/gitleaks

      - name: Install Syft SBOM Generator
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin v1.1.0

          sudo chmod +x /usr/local/bin/syft

      # Install Trivy using its official Debian repository
      - name: Install Trivy Scanner
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      # Verify all installed security tools
      - name: Verify Security Tool Installations
        run: |
          echo "=== Installed Tool Versions ==="

          python -c "import pkg_resources; print('pkg_resources OK')"

          python --version
          semgrep --version
          gitleaks version
          syft version
          trivy --version
          docker --version

      # =========================================================================
      # STAGE 3: DOCKER IMAGE BUILD (BEFORE GATE)
      # =========================================================================

      - name: Build Application Docker Image
        id: docker_build
        run: |
          if [ -f sample_app/Dockerfile ]; then

            echo "Building Docker image from sample_app/Dockerfile..."

            docker build -t securepipeline-demo:latest sample_app/

            echo "image_built=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=securepipeline-demo:latest" >> "$GITHUB_OUTPUT"

          elif [ -f Dockerfile ]; then

            echo "Building Docker image from root Dockerfile..."

            docker build -t securepipeline-demo:latest .

            echo "image_built=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=securepipeline-demo:latest" >> "$GITHUB_OUTPUT"

          else

            echo "No Dockerfile found. Container scanning will be skipped."

            echo "image_built=false" >> "$GITHUB_OUTPUT"
            echo "image_tag=" >> "$GITHUB_OUTPUT"

          fi

      # =========================================================================
      # STAGE 4: SECURITY SCANNING VIA SCANNER MANAGER
      # =========================================================================

      - name: Execute Security Scanners
        run: |
          IMAGE_ARG=""

          if [ "${{ steps.docker_build.outputs.image_built }}" = "true" ]; then
            IMAGE_ARG="--image ${{ steps.docker_build.outputs.image_tag }}"
          fi

          TARGET_DIR="."

          if [ -d sample_app ]; then
            TARGET_DIR="sample_app"
          fi

          echo "Running ScannerManager against target: $TARGET_DIR"

          python -m scanners.scanner_manager --target "$TARGET_DIR" --output reports/raw $IMAGE_ARG

      # =========================================================================
      # STAGE 5: FINDINGS AGGREGATION & NORMALIZATION
      # =========================================================================

      - name: Aggregate Findings & Extract SBOM
        run: |
          python scripts/aggregate.py \
            --manifest reports/raw/scan_manifest.json \
            --raw-dir reports/raw \
            --output reports/aggregated_findings.json

      # =========================================================================
      # STAGE 6: MANDATORY SECURITY GATE ENFORCEMENT
      # =========================================================================

      - name: Enforce Mandatory Security Gate
        id: security_gate
        run: |
          echo "Executing Mandatory Security Gate..."

          python scripts/security_gate.py \
            --aggregated reports/aggregated_findings.json \
            --manifest reports/raw/scan_manifest.json \
            --output reports/security_gate.json \
            --block-severities "CRITICAL,HIGH"

      # =========================================================================
      # STAGE 7: REPORT GENERATION
      # =========================================================================

      - name: Generate Consolidated Security Reports (HTML & JSON)
        if: always()
        run: |
          python scripts/report_generator.py \
            --aggregated reports/aggregated_findings.json \
            --gate reports/security_gate.json \
            --output-dir reports/

      # =========================================================================
      # STAGE 8: AUTOMATED REPORT INGESTION TO FASTAPI BACKEND
      # =========================================================================

      - name: Send Security Report to FastAPI Backend
        if: always()
        env:
          FASTAPI_URL: ${{ secrets.FASTAPI_URL }}
          FASTAPI_TOKEN: ${{ secrets.FASTAPI_TOKEN }}
        run: |
          if [ -z "$FASTAPI_URL" ]; then
            echo "::notice::FASTAPI_URL secret not configured. Skipping automated backend ingestion."
            exit 0
          fi

          if [ ! -f "reports/security_report.json" ]; then
            echo "::warning::reports/security_report.json not found. Ingestion skipped."
            exit 0
          fi

          echo "Delivering security report to FastAPI at $FASTAPI_URL/scans/ingest..."

          AUTH_HEADER=()
          if [ -n "$FASTAPI_TOKEN" ]; then
            AUTH_HEADER=(-H "X-API-Key: $FASTAPI_TOKEN")
          fi

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            "${AUTH_HEADER[@]}" \
            --data @reports/security_report.json \
            "${FASTAPI_URL%/}/scans/ingest" || true)

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "HTTP Status Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "::notice::Security report successfully ingested into FastAPI backend!"
          elif [ "$HTTP_CODE" -eq 409 ]; then
            echo "::notice::Report already ingested in backend database (HTTP 409 Conflict)."
          else
            echo "::warning::Failed to deliver report to backend: HTTP $HTTP_CODE - $RESPONSE_BODY"
          fi

      # =========================================================================
      # STAGE 9: ARTIFACT UPLOAD
      # =========================================================================

      - name: Upload Security Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securepipeline-security-reports
          path: |
            reports/raw/
            reports/*.json
            reports/*.html
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # STAGE 9: DEPLOYMENT CONTROL
  # ===========================================================================

  deploy:
    name: Deployment Gating
    needs: security-pipeline
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Demonstration Deployment Approval
        run: |
          echo "=========================================================="
          echo " [SECURE PIPELINE] DEPLOYMENT AUTHORIZED"
          echo " All security scans executed and the security gate passed."
          echo " Promoting build to production / staging environment."
          echo "=========================================================="
